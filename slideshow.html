<body class="page-slideshow">

<!-- =========================
     Header / navigation
========================= -->
<div id="siteHeader"></div>

<main class="ss-main">
  <h1 class="ss-sr">Gallery slideshow</h1>

  <!-- =========================
       Slideshow stage
       - Built from site-data.json at runtime, so a new gallery entry
         appears here with no edit to this page
       - The stage is what goes full screen, so the caption and controls
         come with it
  ========================= -->
  <div class="ss-stage protect-zone" id="ssStage">

    <div class="ss-view" id="ssView" aria-live="off">
      <div class="ss-msg" id="ssMsg">Loading images…</div>
    </div>

    <!-- Caption, progress and controls. In full screen this block sits
         over the bottom of the image and the controls fade when idle. -->
    <div class="ss-bottom">

    <div class="ss-caption" id="ssCaption" aria-live="polite">
      <a class="ss-title" id="ssTitle" href="/gallery.html" title="Open the write-up for this image"></a>
      <span class="ss-part" id="ssPart"></span>
      <span class="ss-count" id="ssCount" aria-hidden="true"></span>
    </div>

    <div class="ss-progress" aria-hidden="true"><span id="ssBar"></span></div>

    <div class="ss-controls" id="ssControls">

      <div class="ss-group">
        <button class="ss-btn" type="button" id="ssPrev" aria-label="Previous image" title="Previous (left arrow)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button class="ss-btn ss-play" type="button" id="ssPlay" aria-label="Pause slideshow" title="Play or pause (space)">
          <svg class="ss-icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          <svg class="ss-icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
        </button>
        <button class="ss-btn" type="button" id="ssNext" aria-label="Next image" title="Next (right arrow)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>

      <div class="ss-group ss-speed" role="group" aria-label="Time on each image">
        <button class="ss-chip" type="button" data-secs="3" aria-pressed="false">3s</button>
        <button class="ss-chip" type="button" data-secs="5" aria-pressed="true">5s</button>
        <button class="ss-chip" type="button" data-secs="7" aria-pressed="false">7s</button>
        <button class="ss-chip" type="button" data-secs="10" aria-pressed="false">10s</button>
      </div>

      <div class="ss-group">
        <button class="ss-chip ss-chip-icon" type="button" id="ssShuffle" aria-pressed="false" title="Show images in random order">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
          <span>Random</span>
        </button>
        <button class="ss-chip ss-chip-icon" type="button" id="ssCinema" aria-pressed="false" title="Slow pan and zoom on each image (C)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 5v14M16 5v14M3 9.5h5M3 14.5h5M16 9.5h5M16 14.5h5"/></svg>
          <span>Cinematic</span>
        </button>
        <!-- Shown once sounds/slideshow-music.mp3 is found -->
        <button class="ss-btn ss-sound" type="button" id="ssSound" hidden aria-label="Mute music" aria-pressed="false" title="Music on or off (M)">
          <svg class="ss-icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>
          <svg class="ss-icon-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
        </button>
        <button class="ss-btn" type="button" id="ssFull" aria-label="Full screen" title="Full screen (F)">
          <svg class="ss-icon-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          <svg class="ss-icon-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
        </button>
      </div>
    </div>

    </div>
  </div>
</main>

<!-- =========================
     Footer
========================= -->
<div id="siteFooter"></div>

<script>
(() => {
  /* ═══════════════════════════════════════════════════════════════
     SLIDESHOW
     Which images are shown, from site-data.json:
       - every gallery entry that is not hidden
       - an entry with an `images` list shows each one in turn
         ("The Moon, 1 of 3"), EXCEPT when `compare: true`, where
         the extra image is an older attempt (Eagle Nebula v1), so
         only the first (newest) image is shown
       - `slideshow_all: true` on a compare entry overrides that and
         shows every image (the Geminids, plain and labelled)
       - video-only entries (no `file`, no `images`) are skipped,
         as Vimeo cannot play offline
     Order follows site-data.json, the same as the gallery page.
  ═══════════════════════════════════════════════════════════════ */

  const SPEEDS     = [3, 5, 7, 10];
  const FADE_MS    = 450;
  const IDLE_MS    = 3500;   // full screen controls fade after this
  const KEY_SPEED  = 'bhapstar:ssSpeed';
  const KEY_RANDOM = 'bhapstar:ssRandom';
  const KB_ZOOM    = 1.16;   // cinematic: how far each image zooms
  const KB_PAN     = 3;      // cinematic: how far it drifts, % of the frame

  const stage    = document.getElementById('ssStage');
  const view     = document.getElementById('ssView');
  const msg      = document.getElementById('ssMsg');
  const titleEl  = document.getElementById('ssTitle');
  const partEl   = document.getElementById('ssPart');
  const countEl  = document.getElementById('ssCount');
  const bar      = document.getElementById('ssBar');
  const playBtn  = document.getElementById('ssPlay');
  const prevBtn  = document.getElementById('ssPrev');
  const nextBtn  = document.getElementById('ssNext');
  const randBtn  = document.getElementById('ssShuffle');
  const cineBtn  = document.getElementById('ssCinema');
  const fullBtn  = document.getElementById('ssFull');
  const speedBtns = Array.from(document.querySelectorAll('.ss-speed .ss-chip'));

  let slides  = [];      // { src, title, part, alt }
  let order   = [];      // indices into slides, in play order
  let pos     = 0;       // position within order
  let playing = true;
  let random  = false;
  let secs    = 5;
  let cinema  = false;
  let timer   = null;
  let remaining = 0;     // ms left on the current image (kept across a pause)
  let deadline  = 0;     // when the running timer fires
  let live    = false;   // an image is on screen and the timer may run
  let motion  = null;    // the cinematic pan/zoom on the current image
  let token   = 0;       // guards against a slow load landing after a newer one
  let failRun = 0;       // consecutive images that would not load
  let wakeLock = null;

  /* ── Saved choices (per device) ── */
  function readPref(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function writePref(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

  const savedSpeed = parseInt(readPref(KEY_SPEED), 10);
  if (SPEEDS.includes(savedSpeed)) secs = savedSpeed;
  random = readPref(KEY_RANDOM) === '1';
  // Cinematic and music start ON every time the page opens. Turning either
  // off lasts for this visit only, so a tap by someone else on the tablet
  // never leaves the next showing without them. Speed and Random are
  // remembered as before.
  cinema = true;

  /* ── Build the slide list ── */
  function buildSlides(all) {
    const out = [];
    all.filter(e => (e.section || 'gallery') === 'gallery' && !e.hidden).forEach(e => {
      let files;
      if (Array.isArray(e.images) && e.images.length) {
        files = e.images.filter(im => im && im.file)
                        .map(im => ({ file: im.file, alt: im.alt || e.alt || e.title || '' }));
      } else if (e.file) {
        files = [{ file: e.file, alt: e.alt || e.title || '' }];
      } else {
        return;
      }
      if (e.compare && !e.slideshow_all) files = files.slice(0, 1);
      files.forEach((f, i) => out.push({
        src:   '/' + String(f.file).replace(/^\/+/, ''),
        title: e.title || '',
        slug:  e.slug || '',
        part:  files.length > 1 ? (i + 1) + ' of ' + files.length : '',
        alt:   f.alt
      }));
    });
    return out;
  }

  function naturalOrder() { return slides.map((_, i) => i); }

  function shuffledOrder(first) {
    const rest = slides.map((_, i) => i).filter(i => i !== first);
    for (let i = rest.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [rest[i], rest[j]] = [rest[j], rest[i]];
    }
    return [first, ...rest];
  }

  /* ── Timer + progress bar ──
     A pause holds the timer, the bar and the cinematic motion where they
     are, and play carries on from there rather than starting the image
     over. Moving to another image resets all three. */
  function progress() {
    const total = secs * 1000;
    const left = timer ? Math.max(0, deadline - performance.now()) : remaining;
    return Math.max(0, Math.min(1, 1 - left / total));
  }

  function drawBar(f) {
    bar.style.transition = 'none';
    bar.style.width = (f * 100) + '%';
  }

  function resetTimer() {
    clearTimeout(timer);
    timer = null;
    remaining = secs * 1000;
    drawBar(0);
  }

  function runTimer() {
    clearTimeout(timer);
    timer = null;
    if (!playing || document.hidden || !live) return;
    drawBar(1 - remaining / (secs * 1000));
    void bar.offsetWidth;
    bar.style.transition = 'width ' + remaining + 'ms linear';
    bar.style.width = '100%';
    deadline = performance.now() + remaining;
    timer = setTimeout(() => go(1), remaining);
    if (motion) motion.play();
  }

  function holdTimer() {
    const f = progress();
    if (timer) remaining = Math.max(0, deadline - performance.now());
    clearTimeout(timer);
    timer = null;
    drawBar(f);
    if (motion) motion.pause();
  }

  /* ── Cinematic pan and zoom (Ken Burns) ──
     Each image gets a slow zoom, in or out, with a gentle drift in a
     random direction. It runs for the image's whole time on screen plus
     the crossfade, so it never stops before the next image arrives. The
     image stays fully fitted (no cropping) at the start of a zoom in. */
  function rnd(a, b) { return a + Math.random() * (b - a); }

  function kbFrames() {
    const zoomIn = Math.random() < 0.6;
    const ang = rnd(0, Math.PI * 2);
    const dx = Math.cos(ang) * KB_PAN, dy = Math.sin(ang) * KB_PAN;
    const near = 'scale(' + KB_ZOOM + ') translate(' + dx.toFixed(2) + '%, ' + dy.toFixed(2) + '%)';
    const far  = 'scale(1) translate(0%, 0%)';
    return zoomIn ? [{ transform: far }, { transform: near }]
                  : [{ transform: near }, { transform: far }];
  }

  function motionMs() { return secs * 1000 + FADE_MS + 300; }

  function startMotion(img, fromNow) {
    if (!img.animate) return null;
    let frames = kbFrames();
    let dur = motionMs();
    // Switched on part way through an image: start from where it sits now
    if (fromNow) {
      frames = [{ transform: 'scale(1) translate(0%, 0%)' }, frames[frames.length - 1]];
      dur = Math.max(1200, remaining + FADE_MS + 300);
    }
    const a = img.animate(frames, { duration: dur, easing: 'linear', fill: 'forwards' });
    if (!playing || document.hidden) a.pause();
    return a;
  }

  function currentImg() {
    const all = view.querySelectorAll('.ss-img.is-in');
    return all.length ? all[all.length - 1] : null;
  }

  /* ── Show one slide ──
     A fresh <img> is made for every slide and the old one removed after
     the fade. Reusing one element lets iOS Safari pile up GPU layers
     across changes on long runs, which this avoids. */
  function show() {
    const slide = slides[order[pos]];
    const my = ++token;
    live = false;
    resetTimer();

    const img = new Image();
    img.className = 'ss-img';
    img.alt = slide.alt;
    img.decoding = 'async';
    img.draggable = false;

    img.onload = () => {
      if (my !== token) return;
      const ready = img.decode ? img.decode().catch(() => {}) : Promise.resolve();
      ready.then(() => {
        if (my !== token) return;
        failRun = 0;
        msg.hidden = true;
        view.querySelectorAll('.ss-img').forEach(old => {
          old.classList.remove('is-in');
          setTimeout(() => old.remove(), FADE_MS + 50);
        });
        view.appendChild(img);
        void img.offsetWidth;
        img.classList.add('is-in');
        motion = cinema ? startMotion(img, false) : null;
        setCaption(slide);
        preloadNext();
        live = true;
        runTimer();
      });
    };

    img.onerror = () => {
      if (my !== token) return;
      failRun++;
      if (failRun >= slides.length) {
        view.querySelectorAll('.ss-img').forEach(old => old.remove());
        msg.textContent = 'The images could not be loaded. Please refresh the page.';
        msg.hidden = false;
        setCaption(null);
        return;
      }
      // Skip any image that will not load, keeping the same direction
      pos = (pos + lastDir + order.length) % order.length;
      show();
    };

    img.src = slide.src;
  }

  function setCaption(slide) {
    titleEl.textContent = slide ? slide.title : '';
    // Every gallery entry has a share page at /share/<slug>.html
    titleEl.href = slide && slide.slug ? '/share/' + encodeURIComponent(slide.slug) + '.html' : '/gallery.html';
    partEl.textContent  = slide ? slide.part  : '';
    countEl.textContent = slide ? (pos + 1) + ' / ' + order.length : '';
  }

  function preloadNext() {
    if (order.length < 2) return;
    const n = slides[order[(pos + 1) % order.length]];
    const p = new Image();
    p.decoding = 'async';
    p.src = n.src;
  }

  let lastDir = 1;
  function go(dir) {
    if (!slides.length) return;
    lastDir = dir;
    pos = (pos + dir + order.length) % order.length;
    // A full pass of a random order gets a fresh shuffle for the next pass
    // (never starting the new pass on the image that ended the last one).
    if (random && dir > 0 && pos === 0 && slides.length > 1) {
      const last = order[order.length - 1];
      let first = last;
      while (first === last) first = Math.floor(Math.random() * slides.length);
      order = shuffledOrder(first);
    }
    show();
  }

  /* ── Play / pause ── */
  function setPlaying(on) {
    playing = on;
    stage.classList.toggle('is-paused', !on);
    playBtn.setAttribute('aria-label', on ? 'Pause slideshow' : 'Play slideshow');
    if (on) runTimer(); else holdTimer();
    syncWakeLock();
  }

  /* ── Keep the screen awake while playing (tablet on a table) ── */
  async function syncWakeLock() {
    const want = playing && !document.hidden;
    try {
      if (want && !wakeLock && 'wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } else if (!want && wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
    } catch (e) { wakeLock = null; }
  }

  /* ── Speed ── */
  function setSpeed(s) {
    // Keep how far through the current image we are, at the new pace
    const f = live ? progress() : 0;
    secs = s;
    speedBtns.forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.secs === s)));
    writePref(KEY_SPEED, String(s));
    remaining = (1 - f) * secs * 1000;
    if (motion && motion.effect) {
      const t = motion.effect.getComputedTiming();
      const mf = t.duration ? (motion.currentTime || 0) / t.duration : 0;
      motion.effect.updateTiming({ duration: motionMs() });
      motion.currentTime = mf * motionMs();
    }
    if (!live) return;
    if (playing && !document.hidden) runTimer(); else drawBar(f);
  }

  /* ── Cinematic on / off ── */
  function setCinema(on) {
    cinema = on;
    cineBtn.setAttribute('aria-pressed', String(on));
    const img = currentImg();
    if (!img) return;
    if (on && !motion) {
      motion = startMotion(img, true);
    } else if (!on && motion) {
      // Ease back to the plain fitted view rather than snapping
      const now = getComputedStyle(img).transform;
      motion.cancel();
      motion = null;
      if (img.animate && now && now !== 'none') {
        img.animate([{ transform: now }, { transform: 'none' }], { duration: 700, easing: 'ease-out' });
      }
    }
  }

  /* ── Random ── */
  function setRandom(on) {
    random = on;
    randBtn.setAttribute('aria-pressed', String(on));
    writePref(KEY_RANDOM, on ? '1' : '0');
    if (!slides.length) return;
    const current = order[pos];
    order = on ? shuffledOrder(current) : naturalOrder();
    pos = on ? 0 : current;
    setCaption(slides[current]);
    preloadNext();
  }

  /* ── Full screen ──
     Uses the browser's full screen mode where it exists (desktop, Android,
     iPad). Where it does not (iPhone), the stage simply fills the window. */
  function fsElement() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
  function isFull() { return !!fsElement() || stage.classList.contains('is-pseudo-fs'); }

  function enterFull() {
    const req = stage.requestFullscreen || stage.webkitRequestFullscreen;
    if (req) {
      try {
        const r = req.call(stage);
        if (r && r.catch) r.catch(() => setPseudo(true));
        return;
      } catch (e) { /* fall through */ }
    }
    setPseudo(true);
  }

  function exitFull() {
    if (fsElement()) {
      const ex = document.exitFullscreen || document.webkitExitFullscreen;
      if (ex) ex.call(document);
    }
    setPseudo(false);
  }

  function setPseudo(on) {
    stage.classList.toggle('is-pseudo-fs', on);
    document.documentElement.classList.toggle('ss-lock', on);
    syncFull();
  }

  function syncFull() {
    const on = isFull();
    stage.classList.toggle('is-full', on);
    fullBtn.setAttribute('aria-label', on ? 'Exit full screen' : 'Full screen');
    if (on) poke(); else stage.classList.remove('is-idle');
  }

  document.addEventListener('fullscreenchange', syncFull);
  document.addEventListener('webkitfullscreenchange', syncFull);

  /* ── Controls fade in full screen after a few idle seconds ── */
  let idleTimer = null;
  function poke() {
    stage.classList.remove('is-idle');
    clearTimeout(idleTimer);
    if (isFull()) idleTimer = setTimeout(() => stage.classList.add('is-idle'), IDLE_MS);
  }
  stage.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') poke(); });
  stage.addEventListener('focusin', poke);

  /* ── Swipe left / right on the image, tap to show controls ── */
  let sx = 0, sy = 0, tracking = false;
  view.addEventListener('pointerdown', e => {
    tracking = true; sx = e.clientX; sy = e.clientY;
  });
  view.addEventListener('pointerup', e => {
    if (!tracking) return;
    tracking = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      go(dx < 0 ? 1 : -1);
      poke();
    } else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
      // Tap: in full screen, bring the controls back; otherwise play/pause
      if (isFull() && stage.classList.contains('is-idle')) poke();
      else if (isFull()) { stage.classList.add('is-idle'); clearTimeout(idleTimer); }
      else setPlaying(!playing);
    }
  });
  view.addEventListener('pointercancel', () => { tracking = false; });

  /* ── Buttons ── */
  prevBtn.addEventListener('click', () => { go(-1); poke(); });
  nextBtn.addEventListener('click', () => { go(1);  poke(); });
  playBtn.addEventListener('click', () => { setPlaying(!playing); poke(); });
  randBtn.addEventListener('click', () => { setRandom(!random); poke(); });
  cineBtn.addEventListener('click', () => { setCinema(!cinema); poke(); });
  fullBtn.addEventListener('click', () => { isFull() ? exitFull() : enterFull(); });
  speedBtns.forEach(b => b.addEventListener('click', () => { setSpeed(+b.dataset.secs); poke(); }));

  /* ── Keyboard ── */
  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.key === 'ArrowRight') { go(1);  poke(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { go(-1); poke(); e.preventDefault(); }
    else if (e.key === ' ' && tag !== 'button') { setPlaying(!playing); poke(); e.preventDefault(); }
    else if (e.key === 'f' || e.key === 'F') { isFull() ? exitFull() : enterFull(); }
    else if (e.key === 'c' || e.key === 'C') { setCinema(!cinema); poke(); }
    else if ((e.key === 'm' || e.key === 'M') && !soundBtn.hidden) { setMuted(!muted); poke(); }
    else if (e.key === 'Escape' && stage.classList.contains('is-pseudo-fs')) { setPseudo(false); }
  });

  /* ── Pause while the tab is hidden, carry on when it comes back ── */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) holdTimer(); else if (playing) runTimer();
    syncWakeLock();
  });

  /* ── Fit the stage to the space under the sticky header ── */
  function fitStage() {
    const h = document.querySelector('#siteHeader header');
    const top = h ? Math.round(h.getBoundingClientRect().height) : 0;
    document.documentElement.style.setProperty('--ss-top', top + 'px');
  }
  fitStage();
  window.addEventListener('resize', fitStage);
  if ('ResizeObserver' in window) {
    new ResizeObserver(fitStage).observe(document.getElementById('siteHeader'));
  }

  /* ── Coming back from a share page ──
     Following a title link remembers which image was showing, so the
     browser's back button returns to that image rather than the first.
     sessionStorage, so it only lasts for this tab. */
  const KEY_RESUME = 'bhapstar:ssResume';
  titleEl.addEventListener('click', () => {
    const slide = slides[order[pos]];
    if (!slide) return;
    try { sessionStorage.setItem(KEY_RESUME, slide.src); } catch (e) {}
  });

  function takeResume() {
    let src = null;
    try {
      src = sessionStorage.getItem(KEY_RESUME);
      sessionStorage.removeItem(KEY_RESUME);
    } catch (e) {}
    return src ? slides.findIndex(s => s.src === src) : -1;
  }

  // If the browser restores this page from its back cache, the slideshow is
  // already where it was, so just drop the saved position.
  window.addEventListener('pageshow', e => {
    if (e.persisted) { try { sessionStorage.removeItem(KEY_RESUME); } catch (err) {} }
  });

  /* ── Background music ──
     One track, looped, from sounds/slideshow-music.mp3. To change it,
     replace that file (keep the name). The button stays hidden until the
     file is found, so the page works the same with no music file at all.
     Music is on whenever the page opens (see the note at the top); the
     button mutes it for this visit only. Browsers will not start sound until the
     viewer touches the page, so the music begins on the first tap or key
     press if it could not start on its own. iPhones and iPads ignore page
     volume, so there the device volume sets how loud it is. */
  const MUSIC_SRC = '/sounds/slideshow-music.mp3';
  const MUSIC_VOL = 0.45;
  const soundBtn  = document.getElementById('ssSound');
  const music     = new Audio();
  let muted     = false;
  let musicOk   = false;
  let fadeRaf   = null;
  let gestureArmed = false;

  function fadeTo(target, ms, done) {
    cancelAnimationFrame(fadeRaf);
    const from = music.volume, t0 = performance.now();
    function step(now) {
      const k = Math.min(1, (now - t0) / ms);
      try { music.volume = from + (target - from) * k; } catch (e) {}
      if (k < 1) fadeRaf = requestAnimationFrame(step);
      else if (done) done();
    }
    fadeRaf = requestAnimationFrame(step);
  }

  function armGesture() {
    if (gestureArmed) return;
    gestureArmed = true;
    const go = (e) => {
      // A tap on the music button itself is handled by its own click
      if (e && e.target && soundBtn.contains(e.target)) return;
      document.removeEventListener('pointerdown', go, true);
      document.removeEventListener('keydown', go, true);
      gestureArmed = false;
      startMusic();
    };
    document.addEventListener('pointerdown', go, true);
    document.addEventListener('keydown', go, true);
  }

  function startMusic() {
    if (!musicOk || muted || document.hidden) return;
    if (!music.paused) { fadeTo(MUSIC_VOL, 600); return; }
    try { music.volume = 0; } catch (e) {}
    const p = music.play();
    if (p && p.then) p.then(() => fadeTo(MUSIC_VOL, 2000)).catch(armGesture);
    else fadeTo(MUSIC_VOL, 2000);
  }

  function stopMusic() {
    if (music.paused) return;
    fadeTo(0, 450, () => music.pause());
  }

  function drawSound() {
    stage.classList.toggle('is-muted', muted);
    soundBtn.setAttribute('aria-pressed', String(muted));
    soundBtn.setAttribute('aria-label', muted ? 'Play music' : 'Mute music');
  }

  function setMuted(on) {
    muted = on;
    drawSound();
    if (on) stopMusic(); else startMusic();
  }

  music.loop = true;
  music.preload = 'auto';
  music.addEventListener('loadedmetadata', () => {
    if (musicOk) return;
    musicOk = true;
    soundBtn.hidden = false;
    drawSound();
    startMusic();
  });
  music.src = MUSIC_SRC;

  soundBtn.addEventListener('click', () => {
    // Not muted but the browser held the music back: this tap starts it
    if (!muted && music.paused) startMusic(); else setMuted(!muted);
    poke();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopMusic(); else startMusic();
  });

  /* ── Start ── */
  async function load() {
    try {
      const res = await fetch('site-data.json', { cache: 'default' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      slides = buildSlides(await res.json());
    } catch (err) {
      console.error('Slideshow data load error:', err);
      msg.textContent = 'The slideshow could not load. Please refresh the page.';
      return;
    }
    if (!slides.length) { msg.textContent = 'No images to show.'; return; }

    setSpeed(secs);
    randBtn.setAttribute('aria-pressed', String(random));
    cineBtn.setAttribute('aria-pressed', String(cinema));
    const resume = takeResume();
    if (random) {
      order = shuffledOrder(resume >= 0 ? resume : Math.floor(Math.random() * slides.length));
      pos = 0;
    } else {
      order = naturalOrder();
      pos = resume >= 0 ? resume : 0;
    }
    setPlaying(true);
    show();
  }

  load();
})();
</script>

<script src="protect-images.js"></script>
<script src="partials/partials.js"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .catch(err => console.warn('SW registration failed:', err));
  });
}
</script>
</body>
