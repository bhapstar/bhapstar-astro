<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#050414" id="themeColor" />
  <script>
  (function(){
    try {
      var saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) {}
  })();
  </script>
  <title>Bhapstar — Taps Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Dark is the default. Every value below has a light counterpart in the
         block underneath, so nothing in this file hardcodes a colour. */
      --bg:         #050414;
      --bg2:        #0a0720;
      --accent:     #a78bfa;
      --accent2:    #60a5fa;
      --accent3:    #34d399;
      --accent4:    #f472b6;
      --accent5:    #fb923c;
      --text:       rgba(255,255,255,0.95);
      --muted:      rgba(200,195,235,0.60);
      --dim:        rgba(200,195,235,0.38);
      --dimmer:     rgba(200,195,235,0.25);
      --line:       rgba(167,139,250,0.15);

      --panel:      rgba(167,139,250,0.04);
      --input-bg:   rgba(255,255,255,0.05);
      --focus-line: rgba(167,139,250,0.45);
      --th-bg:      rgba(167,139,250,0.07);
      --row-line:   rgba(167,139,250,0.07);
      --row-hover:  rgba(167,139,250,0.03);
      --track:      rgba(167,139,250,0.10);
      --pill-bg:    rgba(167,139,250,0.12);
      --pill-line:  rgba(167,139,250,0.35);
      --btn2-line:  rgba(96,165,250,0.25);
      --btn2-bg:    rgba(96,165,250,0.10);
      --btn3-line:  rgba(52,211,153,0.25);
      --btn3-bg:    rgba(52,211,153,0.10);
      --glow1:      rgba(167,139,250,0.07);
      --glow2:      rgba(96,165,250,0.05);
      --err:        #f87171;

      --font:       'Outfit', ui-sans-serif, system-ui, sans-serif;
      --radius:     14px;
      --ease:       cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Light. Accents shift to the darker variants the site's own light theme
       uses, because #a78bfa on white is too pale to read as a heading. */
    html[data-theme="light"] {
      --bg:         #eceaf6;
      --bg2:        #f5f4fc;
      --accent:     #7c5cf6;
      --accent2:    #2f7fe0;
      --accent3:    #0f9f76;
      --accent4:    #d64a98;
      --accent5:    #d97a2b;
      --text:       rgba(26,23,48,0.94);
      /* Alphas raised from the dark theme's equivalents. The faint greys that
         read fine as light-on-dark fall under 3:1 on white, so the whole
         muted scale is pushed up until each step still reads. */
      --muted:      rgba(70,64,110,0.84);
      --dim:        rgba(70,64,110,0.72);
      --dimmer:     rgba(70,64,110,0.62);
      --line:       rgba(124,92,246,0.24);

      --panel:      #ffffff;
      --input-bg:   #ffffff;
      --focus-line: rgba(124,92,246,0.55);
      --th-bg:      rgba(124,92,246,0.07);
      --row-line:   rgba(124,92,246,0.11);
      --row-hover:  rgba(124,92,246,0.045);
      --track:      rgba(124,92,246,0.14);
      --pill-bg:    rgba(124,92,246,0.12);
      --pill-line:  rgba(124,92,246,0.42);
      --btn2-line:  rgba(47,127,224,0.34);
      --btn2-bg:    rgba(47,127,224,0.10);
      --btn3-line:  rgba(15,159,118,0.34);
      --btn3-bg:    rgba(15,159,118,0.10);
      --glow1:      rgba(124,92,246,0.10);
      --glow2:      rgba(47,127,224,0.07);
      --err:        #d33b3b;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      transition: background-color 280ms ease, color 280ms ease;
      min-height: 100vh;
      padding: 40px 20px 80px;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 40% at 20% 20%, var(--glow1) 0%, transparent 70%),
        radial-gradient(ellipse 50% 35% at 80% 70%, var(--glow2) 0%, transparent 70%);
    }

    .wrap { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; }

    header { margin-bottom: 40px; border-bottom: 1px solid var(--line); padding-bottom: 24px; }
    .header-top { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .logo-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent3); box-shadow: 0 0 12px rgba(52,211,153,0.6);
    }
    h1 {
      font-size: 22px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 13px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase;
    }

    /* ── Login ── */
    #loginPanel {
      margin-top: 60px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 36px; max-width: 420px;
    }
    #loginPanel h2 {
      font-size: 15px; font-weight: 600; margin-bottom: 6px;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent);
    }
    #loginPanel p { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
    .input-row { display: flex; gap: 10px; }
    input[type="password"] {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--line);
      border-radius: 8px; color: var(--text);
      font-family: var(--font); font-size: 14px;
      padding: 10px 14px; outline: none;
      transition: border-color 180ms ease;
    }
    input[type="password"]:focus { border-color: var(--focus-line); }
    .btn {
      padding: 10px 20px; border-radius: 8px; border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; font-family: var(--font);
      font-size: 13px; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      cursor: pointer; white-space: nowrap;
      transition: opacity 180ms ease, transform 180ms ease;
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.4; cursor: default; transform: none; }
    .error-msg { margin-top: 12px; font-size: 12px; color: var(--err); display: none; }

    /* ── Stats ── */
    #dashboard { display: none; }
    .stats-bar { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
    .stat-card {
      flex: 1; min-width: 140px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius); padding: 18px 20px;
    }
    .stat-label {
      font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 6px;
    }
    .stat-value {
      font-size: 28px; font-weight: 700;
      background: linear-gradient(90deg, var(--accent4), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .stat-note { font-size: 11px; color: var(--dim); margin-top: 4px; }

    /* ── Controls ── */
    .controls {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
    }
    .controls-left { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .range-btn {
      padding: 6px 14px; border-radius: 20px;
      border: 1px solid var(--line); background: transparent;
      color: var(--muted); font-family: var(--font);
      font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer; transition: all 180ms ease;
    }
    .range-btn.active, .range-btn:hover {
      background: var(--pill-bg);
      border-color: var(--pill-line);
      color: var(--text);
    }
    .refresh-btn {
      padding: 6px 14px; border-radius: 20px;
      border: 1px solid var(--btn2-line); background: transparent;
      color: var(--accent2); font-family: var(--font);
      font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer; transition: all 180ms ease;
    }
    .refresh-btn:hover { background: var(--btn2-bg); }
    .export-btn {
      padding: 6px 14px; border-radius: 20px;
      border: 1px solid var(--btn3-line); background: transparent;
      color: var(--accent3); font-family: var(--font);
      font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer; transition: all 180ms ease;
    }
    .export-btn:hover { background: var(--btn3-bg); }

    /* ── Sections ── */
    .section-title {
      font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted); margin: 32px 0 12px;
    }
    .table-wrap {
      border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead { background: var(--th-bg); }
    th {
      padding: 12px 16px; text-align: left;
      font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); font-weight: 600;
      border-bottom: 1px solid var(--line); white-space: nowrap;
    }
    td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--th-bg);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--row-hover); }

    /* A coloured dot per source, so the eye finds the tag rows without
       reading every label. */
    .src-cell { display: flex; align-items: center; gap: 9px; font-weight: 500; }
    .src-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .src-nfc  { background: var(--accent4); box-shadow: 0 0 8px rgba(244,114,182,0.55); }
    .src-card { background: var(--accent2); box-shadow: 0 0 8px rgba(96,165,250,0.55); }
    .src-qr   { background: var(--accent3); box-shadow: 0 0 8px rgba(52,211,153,0.55); }
    .num-cell { text-align: center; font-weight: 700; font-size: 16px; color: var(--accent4); }
    .dev-cell { text-align: center; color: var(--accent2); font-size: 13px; }
    .day-cell { white-space: nowrap; }
    .day-sub  { font-size: 11px; color: var(--dim); }

    /* The busiest day gets a bar behind it, scaled to the biggest day in
       the window. Cheap to draw and it makes an event night obvious. */
    .bar-cell { width: 32%; min-width: 90px; }
    .bar-track {
      height: 6px; border-radius: 999px;
      background: var(--track); overflow: hidden;
    }
    .bar-fill {
      height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent4));
    }

    .loading { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13px; letter-spacing: 0.08em; }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { text-align: center; padding: 40px 20px; color: var(--dim); font-size: 12.5px; font-style: italic; }

    .page-footer {
      margin-top: 32px; text-align: center;
      font-size: 11px; color: var(--dimmer); letter-spacing: 0.08em;
    }
    .page-footer a { color: var(--dim); text-decoration: none; }
    .page-footer a:hover { color: var(--accent); }

    @media (max-width: 600px) {
      body { padding: 28px 14px 60px; }
      .stat-value { font-size: 22px; }
      th, td { padding: 10px 11px; }
      .bar-cell { display: none; }
    }

    /* ── Theme toggle ──
       Fixed rather than sitting in the header, because the header is hidden
       until you have logged in and the button has to work on the key prompt
       too. Same shape and icons as the one on card.html. */
    .theme-toggle {
      position: fixed; top: 18px; right: 18px; z-index: 20;
      display: inline-flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; padding: 0;
      border-radius: 999px; cursor: pointer;
      background: var(--panel); border: 1px solid var(--line);
      color: var(--accent);
      transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
    }
    .theme-toggle:hover { border-color: var(--pill-line); }
    .theme-toggle:active { transform: scale(0.94); }
    .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .theme-toggle svg { width: 18px; height: 18px; }
    .theme-toggle .icon-moon { display: none; }
    html[data-theme="light"] .theme-toggle .icon-sun { display: none; }
    html[data-theme="light"] .theme-toggle .icon-moon { display: block; }
    @media (max-width: 600px) {
      .theme-toggle { top: 12px; right: 12px; width: 34px; height: 34px; }
      .theme-toggle svg { width: 16px; height: 16px; }
    }

    /* A glow reads as something luminous on a dark surface. On light it just
       looks like a smudge, so the status dots go flat instead. */
    html[data-theme="light"] .logo-dot,
    html[data-theme="light"] .src-dot { box-shadow: none; }
  </style>
</head>
<body>
<div class="wrap">

  <button class="theme-toggle" id="themeBtn" type="button"
          aria-label="Toggle light or dark theme" aria-pressed="false" title="Toggle theme">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M13.5 9.6A5.8 5.8 0 0 1 6.4 2.5 5.8 5.8 0 1 0 13.5 9.6Z"/>
    </svg>
  </button>

  <header id="siteHeader" style="display:none">
    <div class="header-top">
      <div class="logo-dot"></div>
      <h1>Bhapstar Taps Admin</h1>
    </div>
    <div class="subtitle">NFC tag and QR card scans</div>
  </header>

  <!-- Login -->
  <div id="loginPanel">
    <h2>Admin Access</h2>
    <p>Enter your stats key to view the tap dashboard.</p>
    <div class="input-row">
      <input type="password" id="keyInput" placeholder="Stats key…" autocomplete="off" />
      <button class="btn" id="loginBtn">View</button>
    </div>
    <div class="error-msg" id="errorMsg">Incorrect key — please try again.</div>
    <div style="margin-top:20px;font-size:12px;">
      <a href="https://bhapstar.com" style="color:var(--muted);text-decoration:none;letter-spacing:0.04em;">← bhapstar.com</a>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">
    <div class="stats-bar" id="statsBar"></div>

    <div class="controls">
      <div class="controls-left">
        <button class="range-btn" data-days="7">7 days</button>
        <button class="range-btn" data-days="30">30 days</button>
        <button class="range-btn active" data-days="60">60 days</button>
        <button class="range-btn" data-days="365">Year</button>
      </div>
      <div style="display:flex;gap:8px">
        <button class="export-btn" id="exportBtn">⬇ Export CSV</button>
        <button class="refresh-btn" id="refreshBtn">↺ Refresh</button>
      </div>
    </div>

    <div class="loading" id="loadingMsg">
      <div class="spinner"></div>
      Loading tap data…
    </div>

    <div id="content" style="display:none">
      <div class="section-title">By source</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Source</th>
              <th style="text-align:center">Taps</th>
              <th style="text-align:center">Devices</th>
              <th class="bar-cell">Share</th>
            </tr>
          </thead>
          <tbody id="srcBody"></tbody>
        </table>
      </div>

      <div class="section-title" id="dayTitle">By day</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Day</th>
              <th>Source</th>
              <th style="text-align:center">Taps</th>
              <th style="text-align:center">Devices</th>
              <th class="bar-cell">Busiest</th>
            </tr>
          </thead>
          <tbody id="dayBody"></tbody>
        </table>
      </div>
    </div>

    <div class="page-footer">
      Data from <span id="genTime">—</span> · <a href="https://bhapstar.com/card.html?src=nfc">open the card</a>
    </div>
  </div>

</div>

<script>
(function () {
  const WORKER_URL = 'https://bhapstar-taps.bhapindersingh.workers.dev';

  /* How each stored source is labelled and coloured. The keys must match the
     VALID_SRC list in the Worker. 'card' is the QR printed on the physical
     cards; 'qr' is any QR made after the counter existed. */
  const SOURCES = {
    nfc:  { label: 'NFC tag',        cls: 'src-nfc'  },
    card: { label: 'Printed card QR', cls: 'src-card' },
    qr:   { label: 'QR code',        cls: 'src-qr'   }
  };

  const loginPanel = document.getElementById('loginPanel');
  const keyInput   = document.getElementById('keyInput');
  const loginBtn   = document.getElementById('loginBtn');
  const errorMsg   = document.getElementById('errorMsg');
  const dashboard  = document.getElementById('dashboard');
  const loadingMsg = document.getElementById('loadingMsg');
  const content    = document.getElementById('content');
  const statsBar   = document.getElementById('statsBar');
  const srcBody    = document.getElementById('srcBody');
  const dayBody    = document.getElementById('dayBody');
  const dayTitle   = document.getElementById('dayTitle');
  const genTime    = document.getElementById('genTime');

  let statsKey = '';
  let days     = 60;
  let data     = null;

  function esc(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function srcInfo(src) {
    return SOURCES[src] || { label: src, cls: 'src-qr' };
  }

  /* Dates come back as YYYY-MM-DD in UTC. Shown as a readable date with the
     weekday underneath, because an event is a Friday or a Saturday and that
     is usually what you are looking for. */
  function prettyDay(day) {
    const d = new Date(day + 'T00:00:00Z');
    if (isNaN(d)) return { main: day, sub: '' };
    return {
      main: d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }),
      sub:  d.toLocaleDateString(undefined, { weekday: 'long', timeZone: 'UTC' })
    };
  }

  function prettyStamp(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return isNaN(d) ? '—' : d.toLocaleString(undefined, {
      day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
    });
  }

  function bar(value, max) {
    const pct = max > 0 ? Math.round((value / max) * 100) : 0;
    return `<div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>`;
  }

  /* ── Login ── */
  async function login() {
    statsKey = keyInput.value.trim();
    if (!statsKey) return;
    loginBtn.disabled = true;
    loginBtn.textContent = '…';
    errorMsg.style.display = 'none';
    const ok = await fetchData();
    if (!ok) {
      errorMsg.style.display = 'block';
      loginBtn.disabled = false;
      loginBtn.textContent = 'View';
      statsKey = '';
    }
  }

  keyInput.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  loginBtn.addEventListener('click', login);

  /* ── Fetch ── */
  async function fetchData() {
    loadingMsg.style.display = 'block';
    content.style.display = 'none';
    try {
      const r = await fetch(`${WORKER_URL}/stats?key=${encodeURIComponent(statsKey)}&days=${days}`);
      if (r.status === 401) return false;
      if (!r.ok) throw new Error('HTTP ' + r.status);
      data = await r.json();

      loginPanel.style.display = 'none';
      document.getElementById('siteHeader').style.display = 'block';
      dashboard.style.display = 'block';
      render();
      return true;
    } catch (err) {
      console.error(err);
      return false;
    } finally {
      loadingMsg.style.display = 'none';
      loginBtn.disabled = false;
      loginBtn.textContent = 'View';
    }
  }

  /* ── Render ── */
  function render() {
    if (!data) return;
    content.style.display = 'block';

    const overall = data.overall || {};
    const bySrc   = data.by_source || [];
    const byDay   = data.by_day || [];

    /* Devices is the honest headline. Taps counts every time the tag is
       touched, so a phone tested twenty times is twenty taps but one
       device. Reach is the second number. */
    statsBar.innerHTML = `
      <div class="stat-card">
        <div class="stat-label">Total taps</div>
        <div class="stat-value">${overall.taps || 0}</div>
        <div class="stat-note">every touch and scan</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Devices reached</div>
        <div class="stat-value">${overall.devices || 0}</div>
        <div class="stat-note">repeat taps counted once</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">First tap</div>
        <div class="stat-value" style="font-size:15px;padding-top:8px">${esc(prettyStamp(overall.first))}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Most recent</div>
        <div class="stat-value" style="font-size:15px;padding-top:8px">${esc(prettyStamp(overall.last))}</div>
      </div>`;

    // By source
    if (!bySrc.length) {
      srcBody.innerHTML = `<tr><td colspan="4"><div class="empty">No taps recorded yet.</div></td></tr>`;
    } else {
      const maxSrc = Math.max(...bySrc.map(r => r.taps || 0));
      srcBody.innerHTML = bySrc
        .slice()
        .sort((a, b) => (b.taps || 0) - (a.taps || 0))
        .map(r => {
          const info = srcInfo(r.src);
          return `<tr>
            <td><div class="src-cell"><span class="src-dot ${info.cls}"></span>${esc(info.label)}</div></td>
            <td class="num-cell">${r.taps || 0}</td>
            <td class="dev-cell">${r.devices || 0}</td>
            <td class="bar-cell">${bar(r.taps || 0, maxSrc)}</td>
          </tr>`;
        }).join('');
    }

    // By day
    dayTitle.textContent = `By day · last ${data.window_days || days} days`;
    if (!byDay.length) {
      dayBody.innerHTML = `<tr><td colspan="5"><div class="empty">Nothing in this window.</div></td></tr>`;
    } else {
      const maxDay = Math.max(...byDay.map(r => r.taps || 0));
      dayBody.innerHTML = byDay.map(r => {
        const info = srcInfo(r.src);
        const d = prettyDay(r.day);
        return `<tr>
          <td class="day-cell">${esc(d.main)}<div class="day-sub">${esc(d.sub)}</div></td>
          <td><div class="src-cell"><span class="src-dot ${info.cls}"></span>${esc(info.label)}</div></td>
          <td class="num-cell">${r.taps || 0}</td>
          <td class="dev-cell">${r.devices || 0}</td>
          <td class="bar-cell">${bar(r.taps || 0, maxDay)}</td>
        </tr>`;
      }).join('');
    }

    genTime.textContent = prettyStamp(data.generated);
  }

  /* ── Range buttons ── */
  document.querySelectorAll('.range-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      days = parseInt(btn.dataset.days, 10) || 60;
      fetchData();
    });
  });

  document.getElementById('refreshBtn').addEventListener('click', fetchData);

  /* ── CSV ── */
  document.getElementById('exportBtn').addEventListener('click', () => {
    if (!data) return;
    const rows = [['day', 'source', 'taps', 'devices']];
    (data.by_day || []).forEach(r => {
      rows.push([r.day, srcInfo(r.src).label, r.taps || 0, r.devices || 0]);
    });
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = `bhapstar-taps-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });
})();
</script>

<script>
/* Theme toggle. Writes to the same 'theme' key the rest of the site uses, so
   a choice made here follows you to bhapstar.com and back. */
(function () {
  var root = document.documentElement;
  var btn  = document.getElementById('themeBtn');
  var meta = document.getElementById('themeColor');
  if (!btn) return;

  function current() {
    return root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  }
  function apply(theme) {
    root.setAttribute('data-theme', theme);
    try { localStorage.setItem('theme', theme); } catch (e) {}
    btn.setAttribute('aria-pressed', theme === 'light' ? 'true' : 'false');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#eceaf6' : '#050414');
  }

  apply(current());
  btn.addEventListener('click', function () {
    apply(current() === 'light' ? 'dark' : 'light');
  });
})();
</script>
</body>
</html>
