  <!-- Theme is chosen here, before first paint, so nothing flashes.
       ?t=light or ?t=dark forces one, useful for showing someone.

       Deliberately does not read or write localStorage. The site remembers a
       visitor's choice under that key, and this page must not overwrite it
       just because a coin toss came up light. -->
  <script>
  (function(){
    var m = location.search.match(/[?&]t=(light|dark)(?![a-z])/i);
    var t = m ? m[1].toLowerCase() : (Math.random() < 0.5 ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', t);
  })();
  </script>

  <style>
    /* ══════════════════════════════════════════════════
       card.html — the page behind the NFC tag and the QR

       One design, in two themes. Which one you get is a coin
       toss on load, and the header button flips it.

       Imagery comes from site-data.json, the same source the
       index hero uses, so new photographs feed in on their
       own with nothing to update here.
       ══════════════════════════════════════════════════ */

    @font-face{
      font-family:'Outfit';
      src:url('fonts/outfit-latin-wght-normal.woff2') format('woff2-variations');
      font-weight:100 900; font-style:normal; font-display:swap;
      unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    }

    /* ── Dark, the default ── */
    :root{
      --bg:#050414;
      --text:#efedfa;
      --muted:#9b98b8;
      --line:rgba(167,139,250,.22);
      --accent:#a78bfa;
      --tile:rgba(255,255,255,.045);
      --tile-hover:rgba(255,255,255,.085);
      --cell:rgba(255,255,255,.05);
      --pri:linear-gradient(135deg,rgba(167,139,250,.3),rgba(96,165,250,.3));
      --pri-hover:linear-gradient(135deg,rgba(167,139,250,.44),rgba(96,165,250,.44));
      --pri-line:rgba(167,139,250,.5);
      --pri-em:#cfc9ee;
      --code:#f472b6;
      --code-line:rgba(244,114,182,.42);
      --code-soft:rgba(244,114,182,.10);
      --shadow:rgba(0,0,0,.28);
      --grad:linear-gradient(90deg,#a78bfa,#60a5fa,#f472b6,#60a5fa,#a78bfa);
    }

    /* ── Light, matching the site's own light theme tokens ── */
    html[data-theme="light"]{
      --bg:#eceaf6;
      --text:rgba(26,23,48,.94);
      --muted:rgba(70,64,110,.72);
      --line:rgba(124,92,246,.28);
      --accent:#7c5cf6;
      --tile:rgba(255,255,255,.72);
      --tile-hover:#ffffff;
      --cell:rgba(124,92,246,.10);
      --pri:linear-gradient(135deg,rgba(124,92,246,.20),rgba(47,127,224,.20));
      --pri-hover:linear-gradient(135deg,rgba(124,92,246,.32),rgba(47,127,224,.32));
      --pri-line:rgba(124,92,246,.5);
      --pri-em:rgba(70,64,110,.85);
      --code:#c0398c;
      --code-line:rgba(192,57,140,.38);
      --code-soft:rgba(192,57,140,.08);
      --shadow:rgba(26,23,48,.14);
      --grad:linear-gradient(90deg,#7c5cf6,#2f7fe0,#d64a98,#2f7fe0,#7c5cf6);
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
      font-weight:300; line-height:1.55; -webkit-font-smoothing:antialiased;
      min-height:100vh; min-height:100dvh;
      background:var(--bg); color:var(--text);
      transition:background-color .28s ease, color .28s ease;
    }
    a{ -webkit-tap-highlight-color:transparent }

    .wrap{
      position:relative;
      max-width:460px; margin:0 auto;
      padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    /* ─────────── Theme toggle ───────────
       Sat over the top right rather than in a row of its own, so it lines up
       with the name instead of pushing the whole page down. */
    .theme-toggle{
      position:absolute; top:32px; right:18px; z-index:2;
      display:inline-flex; align-items:center; justify-content:center;
      width:38px; height:38px; padding:0;
      border-radius:999px; cursor:pointer;
      background:none; border:1px solid var(--line);
      color:var(--accent);
      transition:background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .theme-toggle:hover{ background:var(--tile); border-color:var(--pri-line) }
    .theme-toggle:active{ transform:scale(.94) }
    .theme-toggle:focus-visible{ outline:2px solid var(--accent); outline-offset:2px }
    .theme-toggle svg{ width:18px; height:18px }
    .theme-toggle .icon-moon{ display:none }
    html[data-theme="light"] .theme-toggle .icon-sun{ display:none }
    html[data-theme="light"] .theme-toggle .icon-moon{ display:block }

    /* ─────────── Identity ─────────── */
    .inner{ padding:30px 18px 30px }
    .top{ text-align:center; margin-bottom:22px }
    h1{
      font-size:25px; font-weight:400; margin:0 0 2px;
      background:var(--grad); background-size:300% 100%;
      -webkit-background-clip:text; background-clip:text;
      -webkit-text-fill-color:transparent; color:transparent;
      animation:gradientRoll 4s linear infinite reverse;
      padding-bottom:.12em; margin-bottom:-.12em;
    }
    @keyframes gradientRoll{
      0%   { background-position:0% 50% }
      100% { background-position:100% 50% }
    }
    .role{ color:var(--muted); font-size:14px; margin:6px 0 0 }
    /* Belt and braces: even if a name or font ever grew, the heading keeps
       clear of the button rather than sliding underneath it. */
    .top h1, .top .role{ padding-right:44px; padding-left:44px }

    /* ─────────── Contact sheet ─────────── */
    .thumbs{
      display:grid; grid-template-columns:repeat(3,1fr); gap:4px;
      margin:22px 0; border-radius:12px; overflow:hidden;
      opacity:0; transition:opacity .55s ease;
    }
    .thumbs.on{ opacity:1 }
    .thumbs a{
      display:block; line-height:0; aspect-ratio:1;
      background:var(--cell) center/cover no-repeat;
      transition:opacity .62s ease;
    }
    /* Set while a cell swaps its picture. The cell fades to the grid
       background, changes underneath, then fades back. */
    .thumbs a.swapping{ opacity:0 }

    /* ─────────── Buttons ─────────── */
    .row{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:9px }
    .grp-label{
      color:var(--muted); margin:20px 0 9px; text-align:center;
      font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    }
    .btn{
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:2px; padding:12px 10px; border-radius:12px; line-height:1.25; text-align:center;
      border:1px solid var(--line); background:var(--tile);
      color:var(--text); text-decoration:none; font-size:15.5px;
      transition:background-color .18s ease, border-color .18s ease,
                 transform .18s ease, box-shadow .18s ease;
    }
    .btn em{ font-style:normal; font-size:11.5px; color:var(--muted); letter-spacing:.01em }
    /* The offer, said on the button it applies to rather than in a footnote */
    .btn em.tag{
      margin-top:4px; padding:2px 7px; border-radius:999px;
      font-size:10px; letter-spacing:.04em; font-weight:500;
      color:var(--code); border:1px solid var(--code-line); background:var(--code-soft);
      white-space:nowrap;
    }
    .btn.wide{ grid-column:1 / -1 }
    .btn.pri{
      background:var(--pri); border-color:var(--pri-line); font-weight:500;
    }
    .btn.pri em{ color:var(--pri-em) }

    /* Rolling gradient on a button's headline. Same gradient, timing and
       direction as the name at the top of the card, so the eye reads them as
       the same treatment rather than two similar ones. Only the span takes
       it: the em underneath keeps its muted grey, which is what stops the
       button turning into a block of moving colour.
       The padding/margin pair is the same descender fix used on the h1 —
       background-clip:text crops the tails off p and y without it. */
    .btn .grad{
      background:var(--grad); background-size:300% 100%;
      -webkit-background-clip:text; background-clip:text;
      -webkit-text-fill-color:transparent; color:transparent;
      animation:gradientRoll 4s linear infinite reverse;
      padding-bottom:.12em; margin-bottom:-.12em;
    }


    /* ─────────── Hover ───────────
       Gated behind a real pointer. On a phone, which is where most of these
       are opened, a plain :hover rule sticks to whatever was tapped last and
       leaves a button looking selected after the tap. */
    @media (hover:hover) and (pointer:fine){
      .btn:hover{
        background-color:var(--tile-hover);
        border-color:var(--pri-line);
        transform:translateY(-1px);
        box-shadow:0 6px 16px var(--shadow);
      }
      .btn.pri:hover{
        background:var(--pri-hover);
        border-color:rgba(124,92,246,.8);
        box-shadow:0 8px 22px var(--shadow);
      }
    }

    /* Breakpoints set by measuring the name against the button, so the two
       never meet. 400px catches the common 390px phone; 340px the smallest. */
    @media (max-width:400px){
      h1{ font-size:22px }
      .theme-toggle{ width:34px; height:34px; top:30px; right:14px }
      .theme-toggle svg{ width:16px; height:16px }
    }
    @media (max-width:348px){
      h1{ font-size:19px }
      .theme-toggle{ width:32px; height:32px; top:28px; right:12px }
    }
    /* Nothing sold today is this narrow, but the heading still holds up. */
    @media (max-width:310px){ h1{ font-size:17px } }

    @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important } }
  </style>
</head>

<body>

<div class="wrap">

            aria-label="Toggle light or dark theme" aria-pressed="false" title="Toggle theme">

      <a href="gallery.html" aria-label="Gallery"></a>
      <a href="gallery.html" aria-label="Gallery"></a>
      <a href="gallery.html" aria-label="Gallery"></a>
      <a href="gallery.html" aria-label="Gallery"></a>

    </div>

</div>

<script>
(function(){
  var root = document.documentElement;
  var meta = document.getElementById('themeColor');
  var btn  = document.getElementById('themeBtn');

  function current(){ return root.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }

  function apply(theme){
    root.setAttribute('data-theme', theme);
    if (meta) meta.setAttribute('content', theme === 'light' ? '#eceaf6' : '#050414');
    if (btn)  btn.setAttribute('aria-pressed', theme === 'light' ? 'true' : 'false');
  }

  apply(current());
  if (btn) btn.addEventListener('click', function(){
    apply(current() === 'light' ? 'dark' : 'light');
  });

  /* ── Tap counter ──
     Cloudflare Web Analytics deliberately discards query strings, so ?src=nfc
     never reaches it and card.html shows as one undifferentiated page. This
     records the source instead, to a small Worker of its own.

     It reads location.search before the replaceState below rewrites the URL,
     it only ever fires for a source we recognise, and it is fire and forget:
     if the Worker is down or the request is blocked, the page does not care.

     The visitor id is the same key the gallery likes module uses, so a device
     that already has one is not given a second. It exists so the stats can
     report distinct devices as well as raw taps, which is what separates a
     hundred of your own test taps from a hundred people at an event. */
  try {
    var TAP_URL   = 'https://bhapstar-taps.bhapindersingh.workers.dev/tap';
    var TAP_SRCS  = { nfc: 1, qr: 1, card: 1 };
    var tapSrc    = new URLSearchParams(location.search).get('src');

    if (tapSrc && TAP_SRCS[tapSrc]) {
      var uid = localStorage.getItem('_bhap_uid');
      if (!uid) {
        uid = (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : String(Date.now()) + '-' + String(Math.random()).slice(2);
        localStorage.setItem('_bhap_uid', uid);
      }
      // text/plain keeps this a simple request, so there is no CORS preflight
      // and the tap costs one round trip rather than two.
      fetch(TAP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify({ src: tapSrc, uid: uid }),
        keepalive: true
      }).catch(function(){ /* a missed tap is not worth a broken page */ });
    }
  } catch (e) { /* localStorage can throw in locked-down browsers */ }

  // Record which theme was served, so Cloudflare shows the split. Written as
  // ct, never as t, so refreshing tosses the coin again rather than sticking.
  try {
    var qs = new URLSearchParams(location.search);
    qs.set('ct', current());
    history.replaceState(null, '', location.pathname + '?' + qs.toString() + location.hash);
  } catch (e) { /* not worth breaking the page over */ }

  /* The contact sheet squares are about 145px wide, so they are fed the
     thumbnails rather than the full gallery files. Every gallery image has
     one, at images/thumbs/ mirroring its path. Full-size frames average
     around 240 KB against roughly 29 KB for a thumbnail, and the grid keeps
     swapping pictures for as long as the page is open, so this is the
     difference between a card that costs a few hundred kilobytes and one
     that quietly runs into megabytes on a phone in the field. */
  function thumb(file){
    return String(file).replace(/^images\//, 'images/thumbs/');
  }

  // Used only if site-data.json cannot be read, so the grid is never bare
  var FALLBACK = [
    'images/thumbs/rosette-nebula-ngc2244.webp',
    'images/thumbs/orion-nebula-m42.webp',
    'images/thumbs/andromeda-galaxy-m31.webp',
    'images/thumbs/pleiades-m45.webp',
    'images/thumbs/jellyfish-nebula-ic443.webp',
    'images/thumbs/eagle-nebula-m16-2.webp'
  ];

  function shuffle(a){
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function paint(pool){
    if (!pool.length) pool = FALLBACK.slice();

    var six = shuffle(pool.slice()).slice(0, 6);
    while (six.length < 6 && pool.length) six.push(pool[six.length % pool.length]);

    var cells = document.querySelectorAll('#dGrid a');
    six.forEach(function(src, i){
      if (cells[i]) cells[i].style.backgroundImage = 'url("' + src + '")';
    });
    document.getElementById('dGrid').classList.add('on');
    cycleGrid(cells, six, pool);
  }

  /* Each cell runs its own timer, so the six never move together and the
     grid never looks like a slideshow. A cell fades out, changes picture
     underneath, then fades back in.

     Two rules keep it calm: a picture already on screen is never chosen,
     so the same frame cannot appear twice, and the next image is fully
     loaded before the fade starts, so a slow connection stalls the change
     rather than showing an empty square. */
  function cycleGrid(cells, showing, pool){
    if (!cells.length) return;
    if (pool.length <= cells.length) return;          // nothing spare to rotate in
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
    if (reduce && reduce.matches) return;

    var FADE = 620;                                    // matches the CSS transition

    function wait(){ return 3000 + Math.random() * 4000; }   // 3s to 7s

    function schedule(i){
      setTimeout(function(){ swap(i); schedule(i); }, wait());
    }

    function swap(i){
      // A hidden tab should not burn through pictures. Wait for the next turn.
      if (document.hidden) return;

      var spare = pool.filter(function(src){ return showing.indexOf(src) === -1; });
      if (!spare.length) return;
      var next = spare[Math.floor(Math.random() * spare.length)];

      var pre = new Image();
      pre.onload = function(){
        var cell = cells[i];
        cell.classList.add('swapping');
        setTimeout(function(){
          cell.style.backgroundImage = 'url("' + next + '")';
          showing[i] = next;
          cell.classList.remove('swapping');
        }, FADE);
      };
      pre.src = next;                                  // a failed load just skips a turn
    }

    for (var i = 0; i < cells.length; i++) schedule(i);
  }

  /* One read of site-data.json feeds both the counts and the imagery.
     Counts use exactly the rule index.html uses for "By the numbers",
     so the two pages always agree. Images in a group count individually,
     and so do videos. */
  fetch('site-data.json', { cache: 'default' })
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(all){
      var gal = all.filter(function(it){ return (it.section || 'gallery') === 'gallery'; });

      var imgs = gal.reduce(function(n, it){
        return n + ((Array.isArray(it.images) && it.images.length) ? it.images.length
                  : (Array.isArray(it.videos) && it.videos.length) ? it.videos.length
                  : 1);
      }, 0);
      var arts = all.filter(function(it){ return it.section === 'article'; }).length;
      Array.prototype.forEach.call(document.querySelectorAll('.n-img'), function(el){ el.textContent = imgs; });
      Array.prototype.forEach.call(document.querySelectorAll('.n-art'), function(el){ el.textContent = arts; });

      // Every still in the gallery, groups flattened. Videos are skipped:
      // their posters exist, but a still frame of a timelapse makes a poor
      // thumbnail here.
      var pool = [];
      gal.forEach(function(it){
        if (Array.isArray(it.images) && it.images.length) {
          it.images.forEach(function(im){ if (im && im.file) pool.push(thumb(im.file)); });
        } else if (it.file) {
          pool.push(thumb(it.file));
        }
      });
      paint(pool);
    })
    .catch(function(){ paint([]); });
})();
</script>
