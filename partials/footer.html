<!-- =========================
     Footer
     - Mirrors the header: the same plain gradient nav links,
       sitting ABOVE the © line. Keep the two lists in step
     - Reuses the header's .nav-menu classes, sized down via
       footer-scoped CSS overrides
     - © line + Instagram/X socials sit beneath the links
     - Copyright year (#y) populated by partials.js from the
       visitor's clock, so it rolls over on 1 January by itself
     - © line, brand and icons all use the same moving gradient
       as the nav links. The icons take it from #footerIconGrad
       below, which copies the CSS gradientRoll animation
       (same colours, 300% width, 4s, reversed)
========================= -->
<footer>
  <svg class="footer-defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="footerIconGrad" gradientUnits="userSpaceOnUse" x1="-48" y1="0" x2="24" y2="0">
        <stop offset="0" stop-color="#a78bfa"/>
        <stop offset="0.25" stop-color="#60a5fa"/>
        <stop offset="0.5" stop-color="#f472b6"/>
        <stop offset="0.75" stop-color="#60a5fa"/>
        <stop offset="1" stop-color="#a78bfa"/>
        <animate attributeName="x1" values="-48;0" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="24;72" dur="4s" repeatCount="indefinite"/>
      </linearGradient>
    </defs>
  </svg>
  <div class="wrap">
    <div class="footer-nav">

      <nav class="nav-menu footer-menu" aria-label="Footer navigation">
        <a href="/index.html">Home</a>
        <a href="/start-here.html">Start Here</a>
        <a href="/gallery.html">Gallery</a>
        <a href="/prints.html">Prints</a>
        <a href="/gear.html">Gear</a>
        <a href="/articles.html">Articles</a>
        <a href="/puzzles.html">Puzzles</a>
      </nav>

      <div class="footer-meta">
        <span class="footer-copy"><span class="footer-year">©&nbsp;<span id="y"></span></span>&nbsp;<a href="/index.html" class="footer-brand"><span class="mark">bhapstar</span><span class="sub">astrophotography</span></a></span>

        <span class="footer-social">
          <a href="https://www.instagram.com/bhapstar/"
             target="_blank" rel="noopener noreferrer"
             aria-label="Bhapstar on Instagram" class="social-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
                 xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <rect x="2" y="2" width="20" height="20" rx="5" stroke="url(#footerIconGrad) #a78bfa" stroke-width="2"/>
              <circle cx="12" cy="12" r="5" stroke="url(#footerIconGrad) #a78bfa" stroke-width="2"/>
              <circle cx="17.5" cy="6.5" r="1.2" fill="url(#footerIconGrad) #a78bfa"/>
            </svg>
          </a>
          <a href="https://x.com/bhapstar"
             target="_blank" rel="noopener noreferrer"
             aria-label="Bhapstar on X" class="social-icon">
            <svg viewBox="0 0 24 24" width="17" height="17"
                 xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <path fill="url(#footerIconGrad) #a78bfa"
                    d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
          </a>
          <!-- Background music on/off, wired up by partials.js -->
          <button type="button" class="social-icon footer-music" aria-pressed="false"
                  aria-label="Play background music" title="Background music">
            <svg class="fm-on" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="url(#footerIconGrad) #a78bfa"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/>
            </svg>
            <svg class="fm-off" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="url(#footerIconGrad) #a78bfa"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>
            </svg>
          </button>
        </span>
      </div>

    </div>
  </div>
</footer>
