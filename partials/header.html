<!-- =========================
     Header / navigation
     - Brand sits on the top row, centred
     - Nav links sit on a second row beneath it,
       always visible and wrapping like the footer
       (the burger menu has been removed)
     - Every nav entry is a plain link, no dropdowns. Sub pages
       are reached from a link on their parent page:
         Start Here  -> Tonight
         Gallery     -> Slideshow
         Prints      -> Print Simulator
         Articles    -> Field Cards, Glossary
         Puzzles     -> the four games (puzzles.html)
       Keep the footer menu in step with this one.
     - Active link (.active + aria-current) is set by partials.js.
       On a sub page it lights the parent entry (NAV_PARENT there)
     - Background music button sits beside the theme toggle
       (top left on phones); it shares its code with the
       footer music button in partials.js
     - The music and theme icons use the same moving gradient
       as the nav links, taken from #headerIconGrad below.
       It copies the CSS gradientRoll animation (same colours,
       300% width, 4s, reversed). The footer has its own copy
       so each partial works on its own.
========================= -->
<header>
  <svg class="header-defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="headerIconGrad" gradientUnits="userSpaceOnUse" x1="-48" y1="0" x2="24" y2="0">
        <stop offset="0" stop-color="#a78bfa"/>
        <stop offset="0.25" stop-color="#60a5fa"/>
        <stop offset="0.5" stop-color="#f472b6"/>
        <stop offset="0.75" stop-color="#60a5fa"/>
        <stop offset="1" stop-color="#a78bfa"/>
        <animate attributeName="x1" values="-48;0" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="24;72" dur="4s" repeatCount="indefinite"/>
      </linearGradient>
    </defs>
  </svg>
  <div class="wrap">
    <div class="navbar">

      <a class="brand" href="/index.html" aria-label="bhapstar astrophotography — home">
        <span class="mark">bhapstar</span>
        <span class="sub">astrophotography</span>
      </a>

      <nav id="siteNav" class="nav-menu" aria-label="Site navigation">
        <a href="/index.html">Home</a>
        <a href="/start-here.html">Start Here</a>
        <a href="/gallery.html">Gallery</a>
        <a href="/prints.html">Prints</a>
        <a href="/gear.html">Gear</a>
        <a href="/articles.html">Articles</a>
        <a href="/puzzles.html">Puzzles</a>
      </nav>

      <!-- Background music on/off. Same control as the footer button,
           wired up by partials.js so the two always match. -->
      <button class="header-music" type="button" aria-pressed="false"
              aria-label="Play background music" title="Background music">
        <svg class="fm-on" viewBox="0 0 24 24" fill="none" stroke="url(#headerIconGrad) #a78bfa"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/>
        </svg>
        <svg class="fm-off" viewBox="0 0 24 24" fill="none" stroke="url(#headerIconGrad) #a78bfa"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>
        </svg>
      </button>

      <button class="theme-toggle" type="button" aria-label="Toggle light or dark theme" aria-pressed="false" title="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="url(#headerIconGrad) #a78bfa" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="url(#headerIconGrad) #a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/>
        </svg>
      </button>

    </div>
  </div>
</header>
