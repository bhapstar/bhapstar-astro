name: Build & deploy site to Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # commit regenerated files back
  pages: write      # deploy to Pages
  id-token: write   # verify deploy origin

# Queue deployments instead of letting them collide — this is what kills
# the "Deployment failed, try again later" error for good.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate sitemap + structured data + share pages + gear pages
        run: |
          python generate-sitemap.py
          python generate-schema.py
          python generate-share-pages.py
          python generate-gear-pages.py

      - name: Bump SW cache version
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          sed -i "s/const CACHE_VERSION = 'bhapstar-[^']*'/const CACHE_VERSION = 'bhapstar-${COMMIT}'/\" sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit regenerated files back
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml gallery.html field_notes.html sw.js share gear
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Auto: regenerate sitemap + structured data + share pages + gear pages, bump SW cache"
            git pull --rebase origin main
            git push
          fi
